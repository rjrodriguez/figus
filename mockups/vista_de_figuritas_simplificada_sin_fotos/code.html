<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Argentina Sticker Collection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Geist:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary": "#006e2f",
                        "on-primary-fixed-variant": "#3f465c",
                        "surface-dim": "#cbdbf5",
                        "surface-bright": "#f8f9ff",
                        "background": "#f8f9ff",
                        "on-tertiary": "#ffffff",
                        "outline-variant": "#c6c6cd",
                        "on-error-container": "#93000a",
                        "on-secondary-container": "#007432",
                        "error-container": "#ffdad6",
                        "on-tertiary-container": "#b87500",
                        "on-tertiary-fixed": "#2a1700",
                        "secondary-fixed-dim": "#4ae176",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#565e74",
                        "on-tertiary-fixed-variant": "#653e00",
                        "inverse-on-surface": "#eaf1ff",
                        "inverse-surface": "#213145",
                        "primary-fixed": "#dae2fd",
                        "surface-container-high": "#dce9ff",
                        "tertiary-fixed": "#ffddb8",
                        "on-secondary-fixed-variant": "#005321",
                        "error": "#ba1a1a",
                        "surface-container": "#e5eeff",
                        "on-primary-container": "#7c839b",
                        "on-primary-fixed": "#131b2e",
                        "on-error": "#ffffff",
                        "primary-container": "#131b2e",
                        "on-background": "#0b1c30",
                        "tertiary": "#000000",
                        "surface-container-highest": "#d3e4fe",
                        "inverse-primary": "#bec6e0",
                        "tertiary-fixed-dim": "#ffb95f",
                        "primary": "#000000",
                        "surface": "#f8f9ff",
                        "on-secondary-fixed": "#002109",
                        "on-primary": "#ffffff",
                        "on-surface": "#0b1c30",
                        "secondary-fixed": "#6bff8f",
                        "outline": "#76777d",
                        "tertiary-container": "#2a1700",
                        "surface-variant": "#d3e4fe",
                        "on-surface-variant": "#45464d",
                        "primary-fixed-dim": "#bec6e0",
                        "secondary-container": "#6bff8f",
                        "surface-container-low": "#eff4ff",
                        "surface-container-lowest": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "4px",
                        "lg": "24px",
                        "sm": "8px",
                        "grid-gutter": "12px",
                        "xl": "32px",
                        "container-padding": "16px",
                        "md": "16px",
                        "xs": "4px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "number-heavy": ["Geist"],
                        "display": ["Inter"],
                        "h2": ["Inter"],
                        "body-base": ["Inter"],
                        "h1": ["Inter"],
                        "label-caps": ["Geist"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "number-heavy": ["14px", {"lineHeight": "14px", "fontWeight": "700"}],
                        "display": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "h2": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "body-base": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "h1": ["20px", {"lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .sticker-grayscale {
            filter: grayscale(100%);
            opacity: 0.4;
        }
        .soft-drop {
            box-shadow: 0px 2px 4px rgba(15, 23, 42, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-base antialiased min-h-screen pb-20">
<!-- TopAppBar Shell -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding h-16 bg-surface-container-lowest dark:bg-surface-container border-b border-outline-variant dark:border-outline shadow-sm">
<div class="flex items-center gap-md">
<button class="text-on-surface hover:bg-surface-container-high transition-colors p-base rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-display text-h1 font-bold text-primary dark:text-inverse-primary">Argentina 🇦🇷</h1>
</div>
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface dark:text-on-surface-variant" data-icon="account_circle">account_circle</span>
</div>
</header>
<!-- Content Canvas -->
<main class="mt-16 px-container-padding pt-lg">
<!-- Team Progress Section -->
<div class="mb-lg">
<div class="flex justify-between items-end mb-sm">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider">Completion Status</span>
<span class="font-number-heavy text-number-heavy text-secondary">18/20</span>
</div>
<div class="w-full bg-surface-container-high h-1 rounded-full overflow-hidden">
<div class="bg-secondary h-full rounded-full w-[90%]"></div>
</div>
</div>
<!-- Stickers Grid -->
<div class="grid grid-cols-2 gap-grid-gutter pb-xl">
<!-- StickerCard 1: Owned -->
<div class="relative bg-surface-container-low rounded-lg border border-secondary p-xs soft-drop group active:scale-[0.98] transition-transform">
<div class="absolute top-sm right-sm z-10 bg-secondary rounded-full p-0.5 flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-on-secondary" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="aspect-[3/4] rounded-md overflow-hidden bg-white mb-xs sticker-grayscale"><div class="flex items-center justify-center h-full"><span class="font-display text-display font-bold text-outline-variant">ARG 01</span></div></div>
<div class="px-xs pb-xs">
<p class="font-number-heavy text-[10px] text-outline">ARG 01</p>
</div>
</div>
<!-- StickerCard 2: Missing -->
<div class="relative bg-surface-container-low rounded-lg border border-dashed border-outline-variant p-xs group active:scale-[0.98] transition-transform">
<div class="aspect-[3/4] rounded-md overflow-hidden bg-surface-container flex items-center justify-center mb-xs"><div class="flex items-center justify-center h-full"><span class="font-display text-display font-bold text-outline-variant">ARG 02</span></div></div>
<div class="px-xs pb-xs">
<p class="font-number-heavy text-[10px] text-outline">ARG 02</p>
</div>
</div>
<!-- Sticker 3 (Standard Owned) -->
<div class="relative bg-surface-container-low rounded-lg border border-secondary p-xs soft-drop group active:scale-[0.98] transition-transform">
<div class="absolute top-sm right-sm z-10 bg-secondary rounded-full p-0.5 flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-on-secondary" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="aspect-[3/4] rounded-md overflow-hidden bg-white mb-xs"><div class="flex items-center justify-center h-full"><span class="font-display text-display font-bold text-outline-variant">ARG 03</span></div></div>
<div class="px-xs pb-xs">
<p class="font-number-heavy text-[10px] text-outline">ARG 03</p>
</div>
</div>
<!-- Sticker 4 (Standard Owned) -->
<div class="relative bg-surface-container-low rounded-lg border border-secondary p-xs soft-drop group active:scale-[0.98] transition-transform">
<div class="absolute top-sm right-sm z-10 bg-secondary rounded-full p-0.5 flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-on-secondary" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="aspect-[3/4] rounded-md overflow-hidden bg-white mb-xs"><div class="flex items-center justify-center h-full"><span class="font-display text-display font-bold text-outline-variant">ARG 04</span></div></div>
<div class="px-xs pb-xs">
<p class="font-number-heavy text-[10px] text-outline">ARG 04</p>
</div>
</div>
<!-- StickerCard 5: Repeated -->
<div class="relative bg-surface-container-low rounded-lg border border-secondary p-xs soft-drop group active:scale-[0.98] transition-transform">
<div class="absolute bottom-[68px] right-sm z-20">
<button class="relative bg-[#f97316] text-white rounded-full w-10 h-10 flex items-center justify-center shadow-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]">swap_horiz</span>
<span class="absolute -top-1 -right-1 bg-white text-[#f97316] text-[10px] font-bold px-1 rounded-full border border-[#f97316] shadow-sm">+2</span>
</button>
</div>
<div class="aspect-[3/4] rounded-md overflow-hidden bg-white mb-xs"><div class="flex items-center justify-center h-full"><span class="font-display text-display font-bold text-outline-variant">ARG 05</span></div></div>
<div class="px-xs pb-xs">
<p class="font-number-heavy text-[10px] text-outline">ARG 05</p>
</div>
</div>
<!-- Sticker 6 (Standard Owned) -->
<div class="relative bg-surface-container-low rounded-lg border border-secondary p-xs soft-drop group active:scale-[0.98] transition-transform">
<div class="absolute top-sm right-sm z-10 bg-secondary rounded-full p-0.5 flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-on-secondary" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="aspect-[3/4] rounded-md overflow-hidden bg-white mb-xs"><div class="flex items-center justify-center h-full"><span class="font-display text-display font-bold text-outline-variant">ARG 06</span></div></div>
<div class="px-xs pb-xs">
<p class="font-number-heavy text-[10px] text-outline">ARG 06</p>
</div>
</div>
</div>
</main>
<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-16 pb-safe px-4 bg-surface/90 dark:bg-surface-container/90 backdrop-blur-lg border-t border-outline-variant dark:border-outline shadow-none">
<a class="flex flex-col items-center justify-center text-secondary dark:text-secondary-fixed-dim font-bold hover:bg-surface-container-low transition-colors px-4 py-1 rounded-full active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="style">style</span>
<span class="font-label-caps text-label-caps">Album</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-container-low transition-colors px-4 py-1 rounded-full active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="search">search</span>
<span class="font-label-caps text-label-caps">Search</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-container-low transition-colors px-4 py-1 rounded-full active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="swap_horiz">swap_horiz</span>
<span class="font-label-caps text-label-caps">Swap</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline hover:bg-surface-container-low transition-colors px-4 py-1 rounded-full active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-label-caps text-label-caps">Profile</span>
</a>
</nav>
<!-- Contextual FAB (Hidden on detail views per rules, but included if needed for primary country landing) -->
<!-- Suppressed for this detail grid view per instruction "suppress the FAB on Settings, Profile, Details" -->
</body></html>
